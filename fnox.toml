# Secrets the repo tooling needs, declared without their values (fnox:
# https://github.com/jdx/fnox, installed by mise). `cf-admin` defaults to the
# macOS Keychain; to use another backend (age, a password manager...), redefine
# [providers.cf-admin] in a gitignored fnox.local.toml. See voidflow CONTRIBUTING.md
# "Cloudflare deploy tokens as code". Nothing here is secret.

[providers.cf-admin]
type = "keychain"
service = "fnox"

[secrets]
CF_TOKEN_ADMIN= { provider = "cf-admin", value = "voidptr-admin-mint-tokens", description = "User-owned Cloudflare token for voidflow's cf-tokens verbs. Local only, never CI.", if_missing = "error", env=false}

[proxy]
    egress = "permissive"

    [[proxy.rules]]
    secret = "CF_TOKEN_ADMIN"
    domain = "api.cloudflare.com"
    header = "authorization"
    methods = ["GET", "POST", "PUT", "DELETE"]
    paths = ["/client/v4/**"]
