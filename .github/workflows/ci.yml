name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    uses: taraxvoid/voidflow/.github/workflows/site-ci.yml@06bcd5b8ff1cb4d42da4558e734f62d1ac41d152 # v1.0.0-next.8

  preview:
    name: Preview
    needs: validate
    # Same-repo PRs only: fork PRs get no secrets.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ${{ github.workflow }}-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.action != 'closed'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event.action != 'closed'

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: bun install --frozen-lockfile

      - name: Build
        if: github.event.action != 'closed'
        run: bun run build

      - uses: taraxvoid/voidflow/actions/cloudflare-preview@06bcd5b8ff1cb4d42da4558e734f62d1ac41d152 # v1.0.0-next.8
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ github.token }}
          delete: ${{ github.event.action == 'closed' }}

  deploy:
    name: Deploy
    needs: validate
    if: github.event_name == 'push'
    environment: prod
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - id: env
        uses: taraxvoid/voidflow/actions/branch-env-map@06bcd5b8ff1cb4d42da4558e734f62d1ac41d152 # v1.0.0-next.8

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy
        uses: taraxvoid/voidflow/actions/cloudflare-deploy@06bcd5b8ff1cb4d42da4558e734f62d1ac41d152 # v1.0.0-next.8
        with:
          env: ${{ steps.env.outputs.env }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
